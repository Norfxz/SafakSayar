<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🇹🇷 Şafak Sayar 🇹🇷</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 35px 20px;
            background: #1c1c1c;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255,255,255,0.08);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
        }

        #safak {
            font-size: 70px;
            font-weight: bold;
            margin: 10px 0;
        }

        #sehir {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        #tarih {
            font-size: 18px;
            color: #aaa;
        }

        #durum {
            margin-top: 20px;
            font-size: 17px;
            color: #aaa;
        }
    </style>
</head>

        81: "Düzce"

    };

    function hesapla() {

        const simdi = new Date();

        const fark = terhisTarihi - simdi;

        let gun = Math.ceil(
            fark / (1000 * 60 * 60 * 24)
        );


        // Negatif olmasını engelle
        if (gun < 0) {
            gun = 0;
        }


        // ==========================================
        // 0 = DOĞAN GÜNEŞ
        // ==========================================

        if (gun === 0) {

            document.getElementById("safak").textContent = "0";

            document.getElementById("sehir").textContent =
                "DOĞAN GÜNEŞ ☀️🇹🇷";

            document.getElementById("durum").textContent =
                "Şafak doğdu! 🫡🎉";

        }


        // ==========================================
        // 1 - 81 ARASI
        // ==========================================

        else if (gun >= 1 && gun <= 81) {

            document.getElementById("safak").textContent =
                gun;

            document.getElementById("sehir").textContent =
                iller[gun];

            document.getElementById("durum").textContent =
                "Vatan nöbeti devam ediyor... 🫡";

        }


        // ==========================================
        // 81'DEN FAZLA
        // ==========================================

        else {

            document.getElementById("safak").textContent =
                gun;

            document.getElementById("sehir").textContent =
                "Şafak var... 🫡";

            document.getElementById("durum").textContent =
                "Daha yolumuz var.";

        }


        // ==========================================
        // TERHİS TARİHİ
        // ==========================================

        document.getElementById("tarih").textContent =
            "Terhis: " +
            terhisTarihi.toLocaleDateString("tr-TR");

    }


    // Sayfa açıldığında hesapla
    hesapla();


    // Her dakika tekrar hesapla
    setInterval(hesapla, 60000);

</script>

</body>
</html>
